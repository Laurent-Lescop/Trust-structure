<title>Atelier Treillis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #E7ECEA; --panel: #F7F9F8; --inset: #E1E7E4; --raised: #FFFFFF;
  --ink: #152024; --ink-2: #4F5F64; --ink-3: #75868A; --line: #C8D2CF; --line-2: #DCE3E0;
  --accent: #2B6B66; --accent-2: #3A8680; --on-accent: #FFFFFF; --accent-soft: #D3E6E2;
  --tension: #2C62AE; --compression: #BD3F2D;
  --ok: #2A7A4B; --warn: #936012; --bad: #B0302A;
  --ok-soft: #D8ECDF; --warn-soft: #F4E6CB; --bad-soft: #F5D8D4;
  --cell-ok: #9CCDAE; --cell-warn: #EBC77C; --cell-bad: #E59A8F; --cell-na: #D6DCDA;
  --stage-top: #D5DDDA; --stage-bot: #F1F4F2; --hud-bg: rgba(247, 249, 248, 0.86);
  --socle-top: #F2F0EB; --socle-side: #CBC7BE; --slab: #BFC5C2; --figure: #FBFBF8; --neutral-3d: #A7B0B3;
  --font-ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1517; --panel: #161F22; --inset: #1E292D; --raised: #1B2528;
    --ink: #E2EAE8; --ink-2: #A0B0B3; --ink-3: #74878B; --line: #2D3A3E; --line-2: #243034;
    --accent: #6CB6AC; --accent-2: #88C8BF; --on-accent: #0A1715; --accent-soft: #1D3A37;
    --tension: #72A2EA; --compression: #F08270;
    --ok: #62C88E; --warn: #E6B45C; --bad: #F2776E;
    --ok-soft: #173327; --warn-soft: #3A2E17; --bad-soft: #3D1D1B;
    --cell-ok: #2F6B49; --cell-warn: #7D6424; --cell-bad: #7E3530; --cell-na: #253033;
    --stage-top: #0B1012; --stage-bot: #1B2427; --hud-bg: rgba(22, 31, 34, 0.86);
    --socle-top: #DAD7D0; --socle-side: #A5A198; --slab: #9CA3A0; --figure: #F1F1EC; --neutral-3d: #8E989B;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1517; --panel: #161F22; --inset: #1E292D; --raised: #1B2528;
  --ink: #E2EAE8; --ink-2: #A0B0B3; --ink-3: #74878B; --line: #2D3A3E; --line-2: #243034;
  --accent: #6CB6AC; --accent-2: #88C8BF; --on-accent: #0A1715; --accent-soft: #1D3A37;
  --tension: #72A2EA; --compression: #F08270;
  --ok: #62C88E; --warn: #E6B45C; --bad: #F2776E;
  --ok-soft: #173327; --warn-soft: #3A2E17; --bad-soft: #3D1D1B;
  --cell-ok: #2F6B49; --cell-warn: #7D6424; --cell-bad: #7E3530; --cell-na: #253033;
  --stage-top: #0B1012; --stage-bot: #1B2427; --hud-bg: rgba(22, 31, 34, 0.86);
  --socle-top: #DAD7D0; --socle-side: #A5A198; --slab: #9CA3A0; --figure: #F1F1EC; --neutral-3d: #8E989B;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13.5px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Cadre ---------- */
.app { height: 100%; display: grid; grid-template-columns: 330px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.bar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
.brand strong { display: block; font-weight: 750; font-size: 17px; letter-spacing: 0.01em; font-variation-settings: 'wdth' 82; text-transform: uppercase; line-height: 1.1; }
.brand span { display: block; color: var(--ink-3); font-size: 12px; font-variation-settings: 'wdth' 90; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--inset); font-weight: 600; font-variation-settings: 'wdth' 88; white-space: nowrap; cursor: pointer; border: 0; }
.verdict .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); }
.verdict small { font-weight: 450; color: var(--ink-2); }
.verdict[data-s="ok"] { background: var(--ok-soft); } .verdict[data-s="ok"] .dot { background: var(--ok); }
.verdict[data-s="warn"] { background: var(--warn-soft); } .verdict[data-s="warn"] .dot { background: var(--warn); }
.verdict[data-s="bad"] { background: var(--bad-soft); } .verdict[data-s="bad"] .dot { background: var(--bad); }

/* ---------- Paramètres ---------- */
.params { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 4px 16px 24px; }
.psec { padding: 14px 0 10px; border-bottom: 1px solid var(--line-2); }
.psec:last-of-type { border-bottom: 0; }
.psec h3 { margin: 0 0 10px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-2); font-variation-settings: 'wdth' 80; }
.ctl { margin: 0 0 12px; }
.ctl:last-child { margin-bottom: 0; }
.ctl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ctl-head label { color: var(--ink); font-weight: 500; }
.valbox { display: inline-flex; align-items: baseline; gap: 3px; }
.valbox input { width: 64px; text-align: right; padding: 2px 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.valbox input:hover { border-color: var(--line); }
.valbox input:focus { border-color: var(--accent); background: var(--raised); outline: none; }
.valbox .u { color: var(--ink-3); font-size: 12px; min-width: 14px; }
.note { color: var(--ink-3); font-size: 12px; margin-top: 3px; line-height: 1.35; }
input[type=range] { width: 100%; margin: 2px 0; accent-color: var(--accent); height: 18px; background: transparent; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--raised); }
.seg button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 6px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12.5px; font-variation-settings: 'wdth' 86; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--inset); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg svg { display: block; }
select.sel { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--raised); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 550; font-variation-settings: 'wdth' 88; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); color: var(--on-accent); }
.derived { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; background: var(--inset); border-radius: var(--r); font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.derived b { font-weight: 500; color: var(--ink); font-family: var(--font-mono); font-size: 12px; text-align: right; }

/* ---------- Scène ---------- */
.stage { display: grid; grid-template-rows: minmax(320px, 1fr) minmax(220px, 42%); min-height: 0; min-width: 0; }
.viewport { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--stage-top), var(--stage-bot)); min-height: 0; }
.viewport canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.viewport .labels { position: absolute; inset: 0; pointer-events: none; }
.dim-label { font: 500 11px/1 var(--font-mono); color: var(--ink); background: var(--hud-bg); padding: 3px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid var(--line); }
.dim-label.hi { color: var(--accent); }
.hud { position: absolute; z-index: 2; }
.hud-tl { top: 12px; left: 12px; display: flex; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.kf { background: var(--hud-bg); padding: 7px 12px; min-width: 88px; backdrop-filter: blur(6px); }
.kf span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-variation-settings: 'wdth' 80; font-weight: 600; }
.kf b { display: block; font: 600 17px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.kf b small { font-size: 11px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.hud-tr { top: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hud-bl { left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.hud-br { right: 12px; bottom: 12px; }
.disp-toggle { display: none; background: var(--hud-bg); }
.chipbar { display: flex; background: var(--hud-bg); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; backdrop-filter: blur(6px); }
.chipbar button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; font-size: 12px; font-variation-settings: 'wdth' 86; color: var(--ink-2); white-space: nowrap; }
.chipbar button + button { border-left: 1px solid var(--line-2); }
.chipbar button:hover { color: var(--ink); background: var(--inset); }
.chipbar button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chipbar .lbl { padding: 5px 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; font-variation-settings: 'wdth' 80; align-self: center; }
.legend { background: var(--hud-bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 11.5px; backdrop-filter: blur(6px); display: grid; gap: 3px; min-width: 150px; }
.legend .row { display: flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; flex: none; }
.legend .grad { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #3E9A62, #C9B23A 60%, #E0892E 85%, #D0402F); margin: 2px 0; }
.legend .scale { display: flex; justify-content: space-between; color: var(--ink-3); font-family: var(--font-mono); font-size: 10.5px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.14); max-width: 290px; }
.tip strong { font-weight: 650; }
.tip .k { color: var(--ink-3); }
.tip .t { color: var(--tension); } .tip .c { color: var(--compression); }
.gl-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }

/* ---------- Dock ---------- */
.dock { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); background: var(--panel); }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
.tabs button { border: 0; background: transparent; padding: 10px 12px 9px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-3); border-bottom: 2px solid transparent; white-space: nowrap; font-variation-settings: 'wdth' 86; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panes { flex: 1; overflow: auto; min-height: 0; }
.pane { padding: 16px; }
.pane h4 { margin: 0 0 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); font-variation-settings: 'wdth' 80; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; }
.lead { color: var(--ink-2); max-width: 70ch; margin: 0 0 12px; }

.checks { display: grid; gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.check { background: var(--panel); display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 9px 12px; }
.check summary { list-style: none; cursor: pointer; display: contents; }
.pill { display: inline-block; align-self: start; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; padding: 3px 7px; border-radius: 999px; text-align: center; font-variation-settings: 'wdth' 82; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.check .ttl { font-weight: 600; }
.check .val { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.check .exp { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; max-width: 72ch; }

table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variation-settings: 'wdth' 82; white-space: nowrap; }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.cat td { background: var(--inset); font-weight: 650; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); padding: 5px 8px; }
table.t tfoot td { font-weight: 650; border-top: 1px solid var(--line); border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.bar-u { position: relative; height: 6px; background: var(--inset); border-radius: 3px; min-width: 70px; margin-top: 6px; }
.bar-u i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.small { font-size: 12px; color: var(--ink-3); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
.tile { background: var(--panel); padding: 10px 12px; }
.tile span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; font-variation-settings: 'wdth' 80; }
.tile b { display: block; font: 600 18px/1.25 var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile b small { font-size: 11px; font-weight: 500; color: var(--ink-2); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.toolbar select { max-width: 100%; }

.svgwrap { border: 1px solid var(--line-2); border-radius: var(--r); background: var(--raised); overflow: hidden; }
.svgwrap svg { display: block; width: 100%; height: auto; }
svg .ink { fill: var(--ink); } svg .ink2 { fill: var(--ink-2); } svg .ink3 { fill: var(--ink-3); }
svg .s-ink2 { stroke: var(--ink-2); } svg .s-line { stroke: var(--line); }
.mapwrap { position: relative; }
.maptip { position: absolute; pointer-events: none; }
.progress { height: 3px; background: var(--inset); border-radius: 2px; overflow: hidden; margin: 6px 0 10px; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .1s; }
.cmp { display: grid; grid-template-columns: minmax(150px, 1fr) repeat(2, minmax(120px, 1fr)); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.cmp > div { padding: 7px 10px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.cmp > div.h { font-weight: 650; background: var(--inset); }
.cmp > div.k { color: var(--ink-2); }
.cmp > div.v { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.cmp > div.cur { background: var(--accent-soft); }
.hyp { columns: 2 340px; column-gap: 28px; }
.hyp section { break-inside: avoid; margin-bottom: 16px; }
.hyp dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
.hyp dt { color: var(--ink-2); }
.hyp dd { margin: 0; font-family: var(--font-mono); font-size: 12px; text-align: right; }
.hyp p { margin: 0 0 8px; color: var(--ink-2); font-size: 12.5px; max-width: 70ch; }
.warnbox { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--inset); color: var(--ink-2); font-size: 12.5px; margin-bottom: 16px; max-width: 90ch; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
a { color: var(--accent); }

@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { display: flex; flex-direction: column; height: auto; min-height: 100%; }
  .stage { display: contents; }
  .bar { order: 0; flex-wrap: wrap; }
  .viewport { order: 1; height: 64vh; min-height: 340px; }
  .params { order: 2; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .dock { order: 3; min-height: 60vh; }
  .panes { overflow: visible; }
  .hud-tl .kf { min-width: 0; padding: 6px 9px; }
  .kf b { font-size: 14px; }
  .hud-br { display: none; }
  .hud-bl { right: 12px; }
  .chipbar { flex-wrap: wrap; }
  .disp-toggle { display: inline-block; }
  .hud-bl:not(.open) .chipbar { display: none; }
  .hud-tr { top: auto; bottom: 12px; right: 12px; left: 110px; }
  .hud-tr .chipbar { margin-left: auto; }
  .viewport:has(.hud-bl.open) .hud-tr { display: none; }
}
@media (max-width: 480px) {
  .hud-tl .kf:nth-child(n+4) { display: none; }
  .bar .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <svg width="38" height="26" viewBox="0 0 38 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M2 23 L19 3 L36 23 Z"/><path d="M10.5 23 V13 M19 23 V3 M27.5 23 V13 M10.5 13 L19 23 L27.5 13"/></svg>
      <div><strong>Atelier Treillis</strong><span>Fermes paramétriques — outil pédagogique de prédimensionnement</span></div>
    </div>
    <button class="verdict" id="verdict" type="button" data-s="ok" title="Voir le diagnostic"><i class="dot"></i><span id="verdict-txt">Calcul…</span><small id="verdict-sub"></small></button>
  </header>

  <aside class="params" id="params" aria-label="Paramètres de la structure"></aside>

  <main class="stage">
    <div class="viewport" id="viewport">
      <div class="hud hud-tl" id="hud"></div>
      <div class="hud hud-tr" id="views"></div>
      <div class="hud hud-bl" id="display"></div>
      <div class="hud hud-br" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="gl-error" id="gl-error" hidden>La vue 3D n’a pas pu démarrer (WebGL indisponible ou bibliothèque three.js non chargée). Les calculs et les onglets restent utilisables.</div>
    </div>
    <section class="dock" aria-label="Analyse">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="panes" id="panes"></div>
    </section>
  </main>
</div>

<script>
/* js/catalogue.js */
/* Atelier Treillis — catalogues de sections
   Acier : IPE / HEA (EN 10365), tubes carrés SHS et ronds CHS finis à chaud (EN 10210), ronds pleins filetés.
   Bois  : C24 (EN 338), GL24h / GL28h (EN 14080).
   Unités internes : mm, mm², mm⁴, mm³, kg/m. */
(function (G) {
  'use strict';
  const PS = G.PS = G.PS || {};
  const PI = Math.PI;

  const STEEL = { E: 210000, G: 81000, rho: 7850 };
  const GRADES = {
    S235: { key: 'S235', fy: 235, fu: 360 },
    S275: { key: 'S275', fy: 275, fu: 430 },
    S355: { key: 'S355', fy: 355, fu: 490 },
  };
  const TIMBER = {
    C24:   { key: 'C24',   label: 'C24 — bois massif',      fmk: 24, ft0k: 14.5, fc0k: 21, E0mean: 11000, E005: 7400,  rhok: 350, rhomean: 420, gM: 1.30, betac: 0.2, kdef: 0.6 },
    GL24h: { key: 'GL24h', label: 'GL24h — lamellé-collé',  fmk: 24, ft0k: 19.2, fc0k: 24, E0mean: 11500, E005: 9600,  rhok: 385, rhomean: 420, gM: 1.25, betac: 0.1, kdef: 0.6 },
    GL28h: { key: 'GL28h', label: 'GL28h — lamellé-collé',  fmk: 28, ft0k: 22.3, fc0k: 28, E0mean: 12600, E005: 10500, rhok: 425, rhomean: 460, gM: 1.25, betac: 0.1, kdef: 0.6 },
  };

  const num = (v) => String(v).replace('.', ',');

  /* ---------- Tubes carrés finis à chaud (rayons EN 10210 : ro = 1,5 t, ri = t) ---------- */
  function shs(b, t) {
    const ro = 1.5 * t, ri = t, bi = b - 2 * t, k = 4 - PI;
    const dO = b / 2 - 0.2234 * ro, dI = b / 2 - t - 0.2234 * ri;
    const A = b * b - bi * bi - k * (ro * ro - ri * ri);
    const I = (b ** 4 - bi ** 4) / 12 - k * (ro * ro * dO * dO - ri * ri * dI * dI);
    const Wpl = (b ** 3 - bi ** 3) / 4 - k * (ro * ro * dO - ri * ri * dI);
    const i = Math.sqrt(I / A);
    return {
      key: `SHS ${b}×${num(t)}`, label: `□ ${b}×${num(t)}`, fam: 'SHS', mat: 'steel',
      shape: { type: 'SHS', b, t, ro, ri }, h: b, b, t,
      A, Iy: I, Iz: I, iy: i, iz: i, Wely: I / (b / 2), Wply: Wpl, Wplz: Wpl,
      mass: A * 1e-6 * STEEL.rho, perim: (4 * b - (8 - 2 * PI) * ro) / 1000,
      curve: { y: 'a', z: 'a' }, slim: (b - 3 * t) / t, slimType: 'box',
    };
  }

  /* ---------- Tubes ronds ---------- */
  function chs(D, t) {
    const d = D - 2 * t;
    const A = PI / 4 * (D * D - d * d);
    const I = PI / 64 * (D ** 4 - d ** 4);
    const i = Math.sqrt(I / A);
    return {
      key: `CHS ${num(D)}×${num(t)}`, label: `○ ${num(D)}×${num(t)}`, fam: 'CHS', mat: 'steel',
      shape: { type: 'CHS', D, t }, h: D, b: D, t,
      A, Iy: I, Iz: I, iy: i, iz: i, Wely: I / (D / 2), Wply: (D ** 3 - d ** 3) / 6, Wplz: (D ** 3 - d ** 3) / 6,
      mass: A * 1e-6 * STEEL.rho, perim: PI * D / 1000,
      curve: { y: 'a', z: 'a' }, slim: D / t, slimType: 'tube',
    };
  }

  /* ---------- Profilés en I laminés (congés inclus) ---------- */
  function ish(fam, name, h, b, tw, tf, r) {
    const af = (1 - PI / 4) * r * r;            // aire d'un congé
    const dy = h / 2 - tf - 0.2234 * r;         // bras de levier d'un congé (axe fort)
    const dz = tw / 2 + 0.2234 * r;             // bras de levier d'un congé (axe faible)
    const hw = h - 2 * tf;
    const A = 2 * b * tf + hw * tw + 4 * af;
    const Iy = (b * h ** 3 - (b - tw) * hw ** 3) / 12 + 4 * af * dy * dy;
    const Iz = (2 * tf * b ** 3 + hw * tw ** 3) / 12 + 4 * af * dz * dz;
    const Wply = b * tf * (h - tf) + tw * hw * hw / 4 + 4 * af * dy;
    const Wplz = tf * b * b / 2 + hw * tw * tw / 4 + 4 * af * dz;
    // Inertie de torsion avec correction des congés (formule usuelle des profils laminés)
    const al = -0.042 + 0.2204 * tw / tf + 0.1355 * r / tf - 0.0865 * r * tw / (tf * tf) - 0.0725 * tw * tw / (tf * tf);
    const D = ((tf + r) ** 2 + tw * (r + tw / 4)) / (2 * r + tf);
    const It = 2 / 3 * b * tf ** 3 + 1 / 3 * hw * tw ** 3 + 2 * al * D ** 4 - 0.63 * tf ** 4;
    const Iw = Iz * (h - tf) ** 2 / 4;
    const rolledH = h / b > 1.2;
    return {
      key: `${fam} ${name}`, label: `${fam} ${name}`, fam, mat: 'steel',
      shape: { type: 'I', h, b, tw, tf, r }, h, b, tw, tf, r,
      A, Iy, Iz, iy: Math.sqrt(Iy / A), iz: Math.sqrt(Iz / A), Wely: Iy / (h / 2), Wply, Wplz, It, Iw,
      mass: A * 1e-6 * STEEL.rho, perim: (2 * h + 4 * b - 2 * tw) / 1000,
      curve: rolledH ? { y: 'a', z: 'b' } : { y: 'b', z: 'c' },
      flangeSlim: (b - tw - 2 * r) / 2 / tf, webSlim: (h - 2 * tf - 2 * r) / tw, slimType: 'I',
    };
  }

  /* ---------- Ronds pleins filetés (tirants de contreventement) ---------- */
  const AS = { 12: 84.3, 16: 157, 20: 245, 24: 353, 27: 459, 30: 561, 36: 817, 42: 1120 };
  function rod(d) {
    const A = PI * d * d / 4, I = PI * d ** 4 / 64;
    return {
      key: `Ø${d}`, label: `Ø ${d} (M${d})`, fam: 'ROD', mat: 'steel',
      shape: { type: 'ROD', d }, h: d, b: d, A, As: AS[d], Iy: I, Iz: I, iy: d / 4, iz: d / 4,
      Wely: PI * d ** 3 / 32, Wply: d ** 3 / 6, mass: A * 1e-6 * STEEL.rho, perim: PI * d / 1000,
      curve: { y: 'c', z: 'c' }, slimType: 'rod',
    };
  }

  const SHS_DATA = [
    [40, 3], [40, 4], [50, 3], [50, 4], [50, 5], [60, 3], [60, 4], [60, 5], [70, 4], [70, 5],
    [80, 4], [80, 5], [80, 6.3], [90, 5], [90, 6.3], [100, 4], [100, 5], [100, 6.3], [100, 8],
    [120, 5], [120, 6.3], [120, 8], [120, 10], [140, 5], [140, 6.3], [140, 8], [140, 10],
    [150, 6.3], [150, 8], [150, 10], [160, 6.3], [160, 8], [160, 10], [180, 8], [180, 10], [180, 12.5],
    [200, 8], [200, 10], [200, 12.5], [220, 10], [220, 12.5], [250, 10], [250, 12.5], [260, 10],
    [260, 12.5], [300, 10], [300, 12.5], [300, 16], [350, 12.5], [350, 16], [400, 12.5], [400, 16],
  ];
  const CHS_DATA = [
    [33.7, 3.2], [42.4, 3.2], [48.3, 3.2], [48.3, 4], [60.3, 3.2], [60.3, 4], [76.1, 3.2], [76.1, 4],
    [76.1, 5], [88.9, 3.2], [88.9, 4], [88.9, 5], [88.9, 6.3], [101.6, 4], [101.6, 5], [101.6, 6.3],
    [114.3, 4], [114.3, 5], [114.3, 6.3], [139.7, 5], [139.7, 6.3], [139.7, 8], [168.3, 5], [168.3, 6.3],
    [168.3, 8], [168.3, 10], [193.7, 6.3], [193.7, 8], [193.7, 10], [219.1, 6.3], [219.1, 8], [219.1, 10],
    [219.1, 12.5], [244.5, 8], [244.5, 10], [273, 8], [273, 10], [273, 12.5], [323.9, 10], [323.9, 12.5],
    [355.6, 10], [355.6, 12.5], [406.4, 10], [406.4, 12.5], [457, 12.5], [508, 12.5],
  ];
  const IPE_DATA = [
    ['80', 80, 46, 3.8, 5.2, 5], ['100', 100, 55, 4.1, 5.7, 7], ['120', 120, 64, 4.4, 6.3, 7],
    ['140', 140, 73, 4.7, 6.9, 7], ['160', 160, 82, 5.0, 7.4, 9], ['180', 180, 91, 5.3, 8.0, 9],
    ['200', 200, 100, 5.6, 8.5, 12], ['220', 220, 110, 5.9, 9.2, 12], ['240', 240, 120, 6.2, 9.8, 15],
    ['270', 270, 135, 6.6, 10.2, 15], ['300', 300, 150, 7.1, 10.7, 15], ['330', 330, 160, 7.5, 11.5, 18],
    ['360', 360, 170, 8.0, 12.7, 18], ['400', 400, 180, 8.6, 13.5, 21], ['450', 450, 190, 9.4, 14.6, 21],
    ['500', 500, 200, 10.2, 16.0, 21], ['550', 550, 210, 11.1, 17.2, 24], ['600', 600, 220, 12.0, 19.0, 24],
  ];
  const HEA_DATA = [
    ['100', 96, 100, 5, 8, 12], ['120', 114, 120, 5, 8, 12], ['140', 133, 140, 5.5, 8.5, 12],
    ['160', 152, 160, 6, 9, 15], ['180', 171, 180, 6, 9.5, 15], ['200', 190, 200, 6.5, 10, 18],
    ['220', 210, 220, 7, 11, 18], ['240', 230, 240, 7.5, 12, 21], ['260', 250, 260, 7.5, 12.5, 24],
    ['280', 270, 280, 8, 13, 24], ['300', 290, 300, 8.5, 14, 27], ['320', 310, 300, 9, 15.5, 27],
    ['340', 330, 300, 9.5, 16.5, 27], ['360', 350, 300, 10, 17.5, 27], ['400', 390, 300, 11, 19, 27],
    ['450', 440, 300, 11.5, 21, 27], ['500', 490, 300, 12, 23, 27], ['550', 540, 300, 12.5, 24, 27],
    ['600', 590, 300, 13, 25, 27],
  ];

  const byMass = (a, b) => a.mass - b.mass;
  const steel = {
    SHS: SHS_DATA.map(([b, t]) => shs(b, t)).sort(byMass),
    CHS: CHS_DATA.map(([D, t]) => chs(D, t)).sort(byMass),
    IPE: IPE_DATA.map((d) => ish('IPE', ...d)),
    HEA: HEA_DATA.map((d) => ish('HEA', ...d)),
    ROD: [12, 16, 20, 24, 27, 30, 36, 42].map(rod),
  };

  /* Classe de section ≤ 3 en compression pure (EC3 tableau 5.2) */
  function compOK(s, fy) {
    const eps = Math.sqrt(235 / fy);
    if (s.slimType === 'box') return s.slim <= 42 * eps;
    if (s.slimType === 'tube') return s.slim <= 90 * eps * eps;
    if (s.slimType === 'I') return s.flangeSlim <= 14 * eps && s.webSlim <= 42 * eps;
    return true;
  }

  /* ---------- Bois : sections rectangulaires ---------- */
  const timberCache = {};
  function timberLists(key) {
    if (timberCache[key]) return timberCache[key];
    const tg = TIMBER[key];
    const glulam = key.startsWith('GL');
    const make = (b, h) => {
      const A = b * h;
      return {
        key: `${tg.key} ${b}×${h}`, label: `${tg.key} ${b}×${h}`, fam: glulam ? 'GL' : 'BM', mat: 'timber',
        shape: { type: 'RECT', b, h }, b, h, A,
        Iy: b * h ** 3 / 12, Iz: h * b ** 3 / 12, iy: h / Math.sqrt(12), iz: b / Math.sqrt(12),
        Wely: b * h * h / 6, Welz: h * b * b / 6, mass: A * 1e-6 * tg.rhomean, perim: 2 * (b + h) / 1000,
      };
    };
    const widths = glulam ? [90, 115, 140, 160, 185, 210, 240, 265, 300] : [63, 75, 100, 120, 150, 175, 200];
    const heights = glulam ? Array.from({ length: 38 }, (_, i) => 120 + 40 * i) : [75, 100, 120, 150, 175, 200, 225, 250, 275, 300];
    const all = [];
    for (const b of widths) {
      if (glulam || true) all.push(make(b, b));
      for (const h of heights) if (h > b) all.push(make(b, h));
    }
    const pick = (fn) => all.filter(fn).sort(byMass);
    // barres de ferme : largeur minimale pour loger les assemblages (plats en âme + broches)
    const out = {
      truss: pick((s) => s.h / s.b <= 2.01 && s.b >= (glulam ? 115 : 75)),
      column: pick((s) => s.h / s.b <= 4.01 && s.b >= (glulam ? 115 : 100)),
      purlin: pick((s) => s.h / s.b <= 5.01 && s.h >= s.b),
    };
    timberCache[key] = out;
    return out;
  }

  PS.cat = { STEEL, GRADES, TIMBER, steel, compOK, timberLists };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/fem.js */
/* Atelier Treillis — solveur linéaire 2D (méthode des déplacements)
   Éléments « bar » (treillis articulé, effort normal seul) et « beam » (poutre d'Euler-Bernoulli).
   Unités cohérentes : kN, m. Effort normal N > 0 = traction. */
(function (G) {
  'use strict';
  const PS = G.PS = G.PS || {};

  /**
   * model = { nodes:[{x,y}], elems:[{i,j,type:'bar'|'beam',E,A,I}], supports:[{n,ux,uy,rz}] }
   * cases = { name: Float64Array(3*nNodes) [fx,fy,mz par nœud] }
   * → { ok, error?, disp:{name:Float64Array(3n)}, N:{name:Float64Array(ne)}, M1/M2:{name:Float64Array(ne)} (moments d'extrémité, repère local) }
   */
  function solve(model, cases) {
    const { nodes, elems, supports } = model;
    const nn = nodes.length, ne = elems.length;
    const hasRot = new Uint8Array(nn);
    for (const e of elems) if (e.type === 'beam') { hasRot[e.i] = 1; hasRot[e.j] = 1; }

    const dof = new Int32Array(3 * nn).fill(-1);
    let nd = 0;
    for (let k = 0; k < nn; k++) {
      dof[3 * k] = nd++; dof[3 * k + 1] = nd++;
      if (hasRot[k]) dof[3 * k + 2] = nd++;
    }
    const fixed = new Uint8Array(nd);
    for (const s of supports) {
      if (s.ux) fixed[dof[3 * s.n]] = 1;
      if (s.uy) fixed[dof[3 * s.n + 1]] = 1;
      if (s.rz && dof[3 * s.n + 2] >= 0) fixed[dof[3 * s.n + 2]] = 1;
    }
    const map = new Int32Array(nd).fill(-1);
    let nf = 0;
    for (let d = 0; d < nd; d++) if (!fixed[d]) map[d] = nf++;

    const K = new Float64Array(nf * nf);
    const geo = new Array(ne);

    for (let q = 0; q < ne; q++) {
      const e = elems[q];
      const n1 = nodes[e.i], n2 = nodes[e.j];
      const dx = n2.x - n1.x, dy = n2.y - n1.y;
      const L = Math.hypot(dx, dy), c = dx / L, s = dy / L;
      let ids, ke, m;
      if (e.type === 'bar') {
        ids = [dof[3 * e.i], dof[3 * e.i + 1], dof[3 * e.j], dof[3 * e.j + 1]];
        const k = e.E * e.A / L, cc = c * c * k, ss = s * s * k, cs = c * s * k;
        ke = [cc, cs, -cc, -cs, cs, ss, -cs, -ss, -cc, -cs, cc, cs, -cs, -ss, cs, ss];
        m = 4;
      } else {
        ids = [dof[3 * e.i], dof[3 * e.i + 1], dof[3 * e.i + 2], dof[3 * e.j], dof[3 * e.j + 1], dof[3 * e.j + 2]];
        const kl = beamLocal(e.E, e.A, e.I, L);
        const T = rot6(c, s);
        ke = mulTtKT(T, kl);
        m = 6;
      }
      geo[q] = { ids, L, c, s };
      for (let a = 0; a < m; a++) {
        const ga = map[ids[a]];
        if (ga < 0) continue;
        for (let b = 0; b < m; b++) {
          const gb = map[ids[b]];
          if (gb < 0) continue;
          K[ga * nf + gb] += ke[a * m + b];
        }
      }
    }

    // Factorisation de Cholesky (K symétrique définie positive si la structure est stable)
    let dmax = 0;
    for (let i = 0; i < nf; i++) dmax = Math.max(dmax, K[i * nf + i]);
    const tol = 1e-11 * dmax;
    for (let j = 0; j < nf; j++) {
      let sum = K[j * nf + j];
      const rj = j * nf;
      for (let k = 0; k < j; k++) sum -= K[rj + k] * K[rj + k];
      if (!(sum > tol)) return { ok: false, error: 'mécanisme : la structure n\'est pas stable' };
      const Ljj = Math.sqrt(sum);
      K[rj + j] = Ljj;
      for (let i = j + 1; i < nf; i++) {
        const ri = i * nf;
        let v = K[ri + j];
        for (let k = 0; k < j; k++) v -= K[ri + k] * K[rj + k];
        K[ri + j] = v / Ljj;
      }
    }

    const out = { ok: true, disp: {}, N: {}, M1: {}, M2: {} };
    const y = new Float64Array(nf);
    for (const name in cases) {
      const F = cases[name];
      const b = new Float64Array(nf);
      for (let k = 0; k < nn; k++) {
        for (let r = 0; r < 3; r++) {
          const d = dof[3 * k + r];
          if (d >= 0 && map[d] >= 0) b[map[d]] += F[3 * k + r];
        }
      }
      // descente / remontée
      for (let i = 0; i < nf; i++) {
        let v = b[i];
        const ri = i * nf;
        for (let k = 0; k < i; k++) v -= K[ri + k] * y[k];
        y[i] = v / K[ri + i];
      }
      const x = new Float64Array(nf);
      for (let i = nf - 1; i >= 0; i--) {
        let v = y[i];
        for (let k = i + 1; k < nf; k++) v -= K[k * nf + i] * x[k];
        x[i] = v / K[i * nf + i];
      }
      const U = new Float64Array(3 * nn);
      const full = new Float64Array(nd);
      for (let d = 0; d < nd; d++) full[d] = map[d] >= 0 ? x[map[d]] : 0;
      for (let k = 0; k < nn; k++) for (let r = 0; r < 3; r++) { const d = dof[3 * k + r]; U[3 * k + r] = d >= 0 ? full[d] : 0; }
      out.disp[name] = U;

      const Nn = new Float64Array(ne), M1 = new Float64Array(ne), M2 = new Float64Array(ne);
      for (let q = 0; q < ne; q++) {
        const e = elems[q], g = geo[q];
        if (e.type === 'bar') {
          const du = (full[g.ids[2]] - full[g.ids[0]]) * g.c + (full[g.ids[3]] - full[g.ids[1]]) * g.s;
          Nn[q] = e.E * e.A / g.L * du;
        } else {
          const ug = g.ids.map((d) => full[d]);
          const ul = [
            g.c * ug[0] + g.s * ug[1], -g.s * ug[0] + g.c * ug[1], ug[2],
            g.c * ug[3] + g.s * ug[4], -g.s * ug[3] + g.c * ug[4], ug[5],
          ];
          const kl = beamLocal(e.E, e.A, e.I, g.L);
          const f = new Array(6).fill(0);
          for (let a = 0; a < 6; a++) for (let bb = 0; bb < 6; bb++) f[a] += kl[a * 6 + bb] * ul[bb];
          Nn[q] = -f[0];
          M1[q] = f[2];
          M2[q] = f[5];
        }
      }
      out.N[name] = Nn;
      out.M1[name] = M1;
      out.M2[name] = M2;
    }
    return out;
  }

  function beamLocal(E, A, I, L) {
    const a = E * A / L, b = 12 * E * I / L ** 3, c = 6 * E * I / L ** 2, d = 4 * E * I / L, h = 2 * E * I / L;
    return [
      a, 0, 0, -a, 0, 0,
      0, b, c, 0, -b, c,
      0, c, d, 0, -c, h,
      -a, 0, 0, a, 0, 0,
      0, -b, -c, 0, b, -c,
      0, c, h, 0, -c, d,
    ];
  }
  function rot6(c, s) {
    const T = new Array(36).fill(0);
    for (const o of [0, 3]) {
      T[(o) * 6 + o] = c; T[(o) * 6 + o + 1] = s;
      T[(o + 1) * 6 + o] = -s; T[(o + 1) * 6 + o + 1] = c;
      T[(o + 2) * 6 + o + 2] = 1;
    }
    return T;
  }
  function mulTtKT(T, K) {
    const KT = new Array(36).fill(0), R = new Array(36).fill(0);
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { let v = 0; for (let k = 0; k < 6; k++) v += K[i * 6 + k] * T[k * 6 + j]; KT[i * 6 + j] = v; }
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { let v = 0; for (let k = 0; k < 6; k++) v += T[k * 6 + i] * KT[k * 6 + j]; R[i * 6 + j] = v; }
    return R;
  }

  PS.fem = { solve };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/model.js */
/* Atelier Treillis — modèle paramétrique : géométrie de la ferme, trame du bâtiment, charges climatiques.
   Repère 2D de la ferme : x le long de la portée (0 → l), y vers le haut (0 = sous-face de la membrure inférieure
   = tête de poteau). Repère 3D : x transversal, y vertical, z longitudinal. Unités : m, kN. */
(function (G) {
  'use strict';
  const PS = G.PS = G.PS || {};

  PS.DEFAULTS = {
    typo: 'duo', pattern: 'pratt', material: 'steel', roofing: 'zinc',
    span: 16, length: 36, colH: 5, trussH: 3.2, aboutH: 0, flatSlope: 5,
    bayTarget: 6, panelsAuto: true, panels: 8, tieSpacing: 4,
    steelGrade: 'S355', trussFamily: 'SHS', colFamily: 'HEA', timberGrade: 'GL24h',
    snowRegion: 'A2', altitude: 200, windRegion: 2, terrain: 'IIIa',
  };

  PS.ROOFING = {
    zinc: {
      key: 'zinc', label: 'Zinc à joint debout', g: 0.30, minSlope: 0.05, purlinMax: 2.5, deflRatio: 200,
      desc: 'zinc 0,65 mm sur voligeage bois 27 mm, pare-vapeur',
    },
    glass: {
      key: 'glass', label: 'Verrière', g: 0.50, minSlope: 0.10, purlinMax: 1.8, deflRatio: 300,
      desc: 'double vitrage feuilleté 8/16/44.2 sur serreurs aluminium',
    },
  };

  PS.SNOW = { A1: 0.45, A2: 0.45, B1: 0.55, B2: 0.55, C1: 0.65, C2: 0.65, D: 0.90, E: 1.40 };
  PS.WIND_VB = { 1: 22, 2: 24, 3: 26, 4: 28 };
  PS.TERRAIN = {
    '0': { z0: 0.005, zmin: 1, label: '0 — mer, lacs' },
    II: { z0: 0.05, zmin: 2, label: 'II — rase campagne' },
    IIIa: { z0: 0.2, zmin: 5, label: 'IIIa — bocage, habitat dispersé' },
    IIIb: { z0: 0.5, zmin: 9, label: 'IIIb — zones urbanisées, forêts' },
    IV: { z0: 1.0, zmin: 15, label: 'IV — centre-ville dense' },
  };

  /* ---------------- Forme de la toiture ---------------- */
  function roofShape(P) {
    const l = P.span;
    let ha, hr, twoSided;
    if (P.typo === 'duo') { hr = P.trussH; ha = Math.min(Math.max(0, P.aboutH), hr - 0.05); twoSided = true; }
    else if (P.typo === 'mono') { hr = P.trussH; ha = Math.min(Math.max(0, P.aboutH), hr - 0.05); twoSided = false; }
    else { const s = Math.max(0, P.flatSlope) / 100; ha = P.trussH; hr = P.trussH + s * l / 2; twoSided = s > 1e-6; }
    const f = (x) => {
      if (P.typo === 'mono') return ha + (hr - ha) * x / l;
      if (!twoSided) return ha;
      return ha + (hr - ha) * (1 - Math.abs(2 * x / l - 1));
    };
    const slope = P.typo === 'mono' ? (hr - ha) / l : twoSided ? (hr - ha) / (l / 2) : 0;
    return { f, ha, hr, twoSided, slope, alpha: Math.atan(slope), hmax: Math.max(ha, hr) };

  /* ---------------- Ferme 2D pour n panneaux ---------------- */
  function buildTruss(P, shape, n) {
    const l = P.span, dx = l / n;
    const nodes = [], B = [], T = [];
    for (let i = 0; i <= n; i++) { B.push(nodes.length); nodes.push({ x: i * dx, y: 0, kind: 'B', i }); }
    for (let i = 0; i <= n; i++) {
      const y = shape.f(i * dx);
      if (y < 1e-6) T.push(B[i]);
      else { T.push(nodes.length); nodes.push({ x: i * dx, y, kind: 'T', i }); }
    }
    const members = [], seen = new Set();
    const add = (a, b, g, i) => {
      if (a === b) return;
      const key = a < b ? a * 4096 + b : b * 4096 + a;
      if (seen.has(key)) return;
      seen.add(key);
      members.push({ a, b, g, i });
    };
    for (let i = 0; i < n; i++) add(B[i], B[i + 1], 'bot', i);
    for (let i = 0; i < n; i++) add(T[i], T[i + 1], 'top', i);
    for (let i = 0; i <= n; i++) if (T[i] !== B[i]) add(B[i], T[i], 'vert', i);
    // Orientation des diagonales. Pratt : diagonales TENDUES sous charge de toiture uniforme ; Howe : COMPRIMÉES.
    // Le sens géométrique qui donne ce comportement dépend de la forme : on coupe le panneau et on écrit
    // l'équilibre des moments autour du point de concours des deux membrures (méthode de Ritter).
    // Ferme triangulaire : ce point est l'appui, les diagonales « montent » vers le faîtage ;
    // membrures parallèles : il est à l'infini, c'est l'effort tranchant qui décide.
    const yT = (i) => nodes[T[i]].y;
    const Pn = (i) => (i === 0 || i === n ? dx / 2 : dx);
    const R0 = l / 2;
    let sumP = 0, sumPx = 0;
    for (let k = 0; k < n; k++) {
      sumP += Pn(k); sumPx += Pn(k) * k * dx;
      const left = (k + 0.5) * dx < l / 2 - 1e-9;
      const yk = yT(k), yk1 = yT(k + 1), dyk = yk1 - yk, xk = k * dx, xk1 = xk + dx;
      let descTension;
      if (Math.abs(dyk) < 1e-9) descTension = R0 - sumP > 0;
      else {
        const xp = xk - yk * dx / dyk;
        const M = -xp * R0 - (sumPx - xp * sumP);
        const mDesc = -yk * (xk1 - xp), mAsc = yk1 * (xk - xp);
        descTension = Math.abs(M) < 1e-9 ? left : (mDesc !== 0 ? mDesc * -M > 0 : !(mAsc * -M > 0));
      }
      let desc; // true : T_k → B_k+1 (« \ »), false : B_k → T_k+1 (« / »)
      if (P.pattern === 'howe') desc = !descTension;
      else if (P.pattern === 'warren') {
        const m = left ? k : n - 1 - k;
        desc = left ? m % 2 === 1 : m % 2 === 0;
      } else desc = descTension;
      if (desc) add(T[k], B[k + 1], 'diag', k); else add(B[k], T[k + 1], 'diag', k);
    }
    for (const m of members) {
      const a = nodes[m.a], b = nodes[m.b];
      m.L = Math.hypot(b.x - a.x, b.y - a.y);
      m.ang = Math.atan2(Math.abs(b.y - a.y), Math.abs(b.x - a.x)) * 180 / Math.PI;
    }
    const topPanels = [];
    for (let k = 0; k < n; k++) {
      const a = nodes[T[k]], b = nodes[T[k + 1]];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      topPanels.push({ k, a: T[k], b: T[k + 1], len, dx, dy: b.y - a.y, side: shape.twoSided ? ((k + 0.5) * dx < l / 2 ? 'L' : 'R') : 'S' });
    }
    const diagAngles = members.filter((m) => m.g === 'diag').map((m) => m.ang);
    return { n, dx, nodes, members, B, T, topPanels, diagAngles };
  }

  /* Découpage automatique : pannes aux nœuds, diagonales proches de 45°, peu de barres */
  function choosePanels(P, shape) {
    const R = PS.ROOFING[P.roofing];
    const even = shape.twoSided;
    let best = null;
    for (let n = even ? 4 : 2; n <= 40; n += even ? 2 : 1) {
      const t = buildTruss(P, shape, n);
      const lp = Math.max(...t.topPanels.map((p) => p.len));
      let cost = 0.35 * n;
      if (lp > R.purlinMax) cost += 60 + 200 * (lp - R.purlinMax);
      for (const a of t.diagAngles) {
        if (a > 60) cost += 0.02 * (a - 60) ** 2;
        if (a < 30) cost += 0.01 * (30 - a) ** 2;
      }
      if (!best || cost < best.cost) best = { n, cost };
    }
    return best.n;
  }

  /* ---------------- Géométrie complète ---------------- */
  PS.buildGeometry = function (P) {
    const shape = roofShape(P);
    let n = P.panelsAuto ? choosePanels(P, shape) : Math.max(2, Math.round(P.panels));
    if (shape.twoSided && n % 2) n += 1;
    if (shape.twoSided) n = Math.max(4, n);
    const truss = buildTruss(P, shape, n);
    const R = PS.ROOFING[P.roofing];

    // Pannes : à chaque nœud de membrure supérieure (+ pannes intermédiaires si panneau trop long)
    const nodes = truss.nodes;
    const purlins = [];
    const panelSub = truss.topPanels.map((p) => Math.max(1, Math.ceil(p.len / R.purlinMax - 1e-9)));
    for (let k = 0; k <= n; k++) {
      const nd = nodes[truss.T[k]];
      purlins.push({ x: nd.x, y: nd.y, k, atNode: true });
      if (k < n && panelSub[k] > 1) {
        const p = truss.topPanels[k], a = nodes[p.a];
        for (let j = 1; j < panelSub[k]; j++) {
          const t = j / panelSub[k];
          purlins.push({ x: a.x + t * p.dx, y: a.y + t * p.dy, k, atNode: false });
        }
      }
    }
    purlins.sort((a, b) => a.x - b.x);
    // largeur tributaire (le long du rampant) et normale au plan de couverture
    const tp = truss.topPanels;
    const panelAt = (x) => tp[Math.min(n - 1, Math.max(0, Math.floor(x / truss.dx + 1e-9)))];
    for (let j = 0; j < purlins.length; j++) {
      const p = purlins[j];
      const prev = purlins[j - 1], next = purlins[j + 1];
      const d = (q) => q ? Math.hypot(q.x - p.x, q.y - p.y) : 0;
      p.trib = (d(prev) + d(next)) / 2;
      const nrm = (panel) => { const L = panel.len; return [-panel.dy / L, panel.dx / L]; };
      const nL = p.x > 1e-9 ? nrm(panelAt(p.x - 1e-6)) : null;
      const nR = p.x < P.span - 1e-9 ? nrm(panelAt(p.x + 1e-6)) : null;
      let nx = (nL ? nL[0] : 0) + (nR ? nR[0] : 0), ny = (nL ? nL[1] : 0) + (nR ? nR[1] : 0);
      const nl = Math.hypot(nx, ny) || 1; p.nx = nx / nl; p.ny = ny / nl;
    }
    const lpMax = Math.max(...tp.map((p) => p.len));

    // Filants de membrure inférieure (maintiens hors plan)
    const kb = Math.max(1, Math.round(P.tieSpacing / truss.dx));
    const tieSet = new Set();
    for (let i = kb; i < n; i += kb) { tieSet.add(i); tieSet.add(n - i); }
    const ties = [...tieSet].filter((i) => i > 0 && i < n).sort((a, b) => a - b);
    const restr = [0, ...ties, n];

    // Trame longitudinale (logique du tutoriel : arrondi du nombre de travées puis entraxe recalculé)
    const nBays = Math.max(1, Math.round(P.length / P.bayTarget));
    const e = P.length / nBays;
    const braced = new Set([0, nBays - 1]);
    if (P.length > 60 && nBays >= 5) braced.add(Math.floor(nBays / 2));

    // Contreventement de toiture : croix par groupe de panneaux, rampant par rampant
    const planes = shape.twoSided ? [[0, n / 2], [n / 2, n]] : [[0, n]];
    const roofGroups = [];
    for (const [i0, i1] of planes) {
      const len = Math.hypot(nodes[truss.T[i1]].x - nodes[truss.T[i0]].x, nodes[truss.T[i1]].y - nodes[truss.T[i0]].y);
      const g = Math.max(1, Math.min(i1 - i0, Math.round(len / e)));
      let prev = i0;
      for (let j = 1; j <= g; j++) {
        const b = j === g ? i1 : Math.round(i0 + j * (i1 - i0) / g);
        if (b > prev) { roofGroups.push([prev, b]); prev = b; }
      }
    }
    const wallLevels = Math.max(1, Math.round(P.colH / e));

    return {
      shape, truss, n, purlins, panelSub, lpMax, ties, restr, kb,
      nBays, e, nFrames: nBays + 1, braced: [...braced].sort((a, b) => a - b), roofGroups, wallLevels, roofing: R,
    };
  };

  /* ---------------- Charges climatiques (NF EN 1991-1-3 / 1-4, annexes françaises, simplifié) ---------------- */
  function snowSk(region, A) {
    let s = PS.SNOW[region];
    if (A > 200) {
      if (region === 'E') s += A <= 500 ? 1.5 * A / 1000 - 0.30 : A <= 1000 ? 3.5 * A / 1000 - 1.30 : 7 * A / 1000 - 4.80;
      else s += A <= 500 ? A / 1000 - 0.20 : A <= 1000 ? 1.5 * A / 1000 - 0.45 : 3.5 * A / 1000 - 2.45;
    }
    return s;
  }
  function mu1(alphaDeg) {
    if (alphaDeg <= 30) return 0.8;
    if (alphaDeg < 60) return 0.8 * (60 - alphaDeg) / 30;
    return 0;
  }
  function qpeak(region, terrain, z) {
    const vb = PS.WIND_VB[region], T = PS.TERRAIN[terrain];
    const zz = Math.max(z, T.zmin);
    const kr = 0.19 * Math.pow(T.z0 / 0.05, 0.07);
    const lnz = Math.log(zz / T.z0);
    const vm = kr * lnz * vb;
    const kl = 1 - 2e-4 * Math.pow(Math.log10(T.z0) + 3, 6);
    const Iv = kl / lnz;
    return { qp: (1 + 7 * Iv) * 0.5 * 1.225 * vm * vm / 1000, vb, z: zz, Iv, vm };
  }
  const interp = (tab, a) => {
    if (a <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++) if (a <= tab[i][0]) {
      const [a0, v0] = tab[i - 1], [a1, v1] = tab[i];
      return v0 + (v1 - v0) * (a - a0) / (a1 - a0);
    }
    return tab[tab.length - 1][1];
  };
  const CPE = {
    duoH_suc: [[5, -0.6], [15, -0.3], [30, -0.2], [45, 0.0], [60, 0.7], [75, 0.8]],
    duoH_pre: [[5, 0.0], [15, 0.2], [30, 0.4], [45, 0.6], [60, 0.7], [75, 0.8]],
    duoI: [[5, -0.6], [15, -0.4], [30, -0.4], [45, -0.2], [60, -0.2], [75, -0.2]],
    monoH180: [[5, -0.8], [15, -0.9], [30, -0.8], [45, -0.7], [60, -0.5], [75, -0.5]],
  };

  PS.loadParams = function (P, geo) {
    const sk = snowSk(P.snowRegion, P.altitude);
    const aDeg = geo.shape.alpha * 180 / Math.PI;
    const m1 = mu1(aDeg);
    const H = P.colH + geo.shape.hmax;
    const wind = qpeak(P.windRegion, P.terrain, H);
    const hd = H / P.span;
    const t = Math.min(1, Math.max(0, (hd - 0.25) / 0.75));
    const cpeD = 0.7 + 0.1 * t, cpeE = -0.3 - 0.2 * t;
    // cpe de toiture en fonction de la position x, de la direction du vent et de la variante (soulèvement / pression)
    const l = P.span, flatLike = aDeg < 5;
    const roofCpe = (x, fromLeft, variant) => {
      const windward = fromLeft ? x < l / 2 : x > l / 2;
      if (flatLike) return windward ? -0.7 : (variant === 'suc' ? -0.2 : 0.2);
      if (P.typo === 'mono') {
        const fromLow = fromLeft; // la toiture monte vers x = l : vent de gauche = vent sur l'égout bas (θ = 0°)
        if (fromLow) return interp(variant === 'suc' ? CPE.duoH_suc : CPE.duoH_pre, aDeg);
        return interp(CPE.monoH180, aDeg);
      }
      if (windward) return interp(variant === 'suc' ? CPE.duoH_suc : CPE.duoH_pre, aDeg);
      return interp(CPE.duoI, aDeg);
    };
    return {
      sk, mu1: m1, s: m1 * sk, alphaDeg: aDeg, qp: wind.qp, wind, cpeD, cpeE, hd, roofCpe,
      cpi: { suc: 0.2, pre: -0.3 }, gRoof: geo.roofing.g,
    };
  };

<script>

(function (G) {

  function chi(lb, curve) {

  /* Barre de treillis (effort normal + éventuelle flexion locale de membrure). Nt, Nc ≥ 0 en kN ;

  function uAxial(ctx, s, Lin, Lout, Nt, Nc, Mloc) {

  /* Poteau encastré en pied, articulé en tête (ferme posée) : compression + flexion */
